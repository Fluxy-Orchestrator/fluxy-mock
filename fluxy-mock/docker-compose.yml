services:

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16
    container_name: fluxy-mock-postgres
    environment:
      POSTGRES_DB: fluxy_mock
      POSTGRES_USER: fluxy
      POSTGRES_PASSWORD: fluxy
      TZ: UTC
      PGTZ: UTC
    ports:
      - "5434:5432"
    volumes:
      - fluxy-mock-pg-data:/var/lib/postgresql/data
    command: ["postgres", "-c", "timezone=UTC"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fluxy -d fluxy_mock"]
      interval: 5s
      timeout: 5s
      retries: 5


volumes:
  fluxy-mock-pg-data:

